# Testbenches and chip models for the pico-gs2 GPU.
#
# The testbenches depend on the simulator crates that `sinter build` writes
# to build/sinter/, so run `just gen` (or `just build`) before any cargo
# command here.
[workspace]
resolver = "2"
members = ["tb", "../models/sdram"]

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
gpu-sim = { path = "../build/sinter/gpu-sim" }
tmds-encoder-sim = { package = "video__tmds_encoder-sim", path = "../build/sinter/video__tmds_encoder-sim" }
sdram-controller-sim = { package = "sdram__sdram_controller-sim", path = "../build/sinter/sdram__sdram_controller-sim" }
sdram-model = { path = "../models/sdram" }
png = { version = "0.18", default-features = false }

# The generated simulators are hot loops; optimise them even in test builds.
[profile.dev.package.gpu-sim]
opt-level = 3

[profile.dev.package."video__tmds_encoder-sim"]
opt-level = 3

[profile.dev.package."sdram__sdram_controller-sim"]
opt-level = 3

[profile.dev.package.sdram-model]
opt-level = 3
