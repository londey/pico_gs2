# Builds the design, runs every check and test, lints the Verilog and builds
# a bitstream that must meet timing. Tool versions match .devcontainer/Dockerfile.
name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  OSS_CAD_SUITE_DATE: "2026-01-27"
  OSS_CAD_SUITE_VERSION: "20260127"
  JUST_VERSION: "1.54.0"
  SINTER_VERSION: "v1.0.0-rc.1"
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache OSS CAD Suite
        id: oss-cad-suite
        uses: actions/cache@v4
        with:
          path: ~/oss-cad-suite
          key: oss-cad-suite-${{ env.OSS_CAD_SUITE_VERSION }}

      - name: Install OSS CAD Suite
        if: steps.oss-cad-suite.outputs.cache-hit != 'true'
        run: |
          curl -fsSL \
            "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${OSS_CAD_SUITE_DATE}/oss-cad-suite-linux-x64-${OSS_CAD_SUITE_VERSION}.tgz" \
            | tar -xz -C ~

      - name: Install just and sinter
        run: |
          mkdir -p ~/bin
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | bash -s -- --tag "${JUST_VERSION}" --to ~/bin
          cd "$RUNNER_TEMP"
          base="https://github.com/sinter-lang/sinter-lang/releases/download/${SINTER_VERSION}"
          asset="sinter-${SINTER_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSLO "${base}/${asset}"
          curl -fsSLO "${base}/${asset}.sha256"
          sha256sum -c "${asset}.sha256"
          tar -xzf "${asset}" -C ~/bin sinter

      - name: Add tools to PATH
        run: |
          echo "$HOME/bin" >> "$GITHUB_PATH"
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim

      - name: Tool versions
        run: |
          just --version
          sinter --version
          yosys -V
          nextpnr-ecp5 --version
          verilator --version
          rustc --version

      - name: just ci
        run: just ci

      - name: Upload bitstream
        uses: actions/upload-artifact@v4
        with:
          name: bitstream
          path: |
            build/fpga/top.bit
            build/fpga/nextpnr.log
            build/fpga/report.json
